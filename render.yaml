services:
  - type: web
    name: movie-plus
    runtime: image
    plan: free
    image:
      url: ghcr.io/mtvpls/movie-plus:latest
    envVars:
      - key: USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      - key: NEXT_PUBLIC_SITE_NAME
        value: movie-plus
      - key: CRON_PASSWORD
        value: mtvpls
