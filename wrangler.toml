name = "movie-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "movie"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
USERNAME = "admin"
PASSWORD = "admin@123"
TMDB_API_KEY = "463a551ea591e6e801cdb16fdfbb757c"
CONFIG_SUBSCRIPTION_URL = "https://raw.githubusercontent.com/hafrey1/LunaTV-config/refs/heads/main/LunaTV-config.txt"
