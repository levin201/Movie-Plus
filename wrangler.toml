name = "movie-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "movie"
database_id = "ca30974f-9429-4a00-872a-a107b12bcaf9"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
CONFIG_SUBSCRIPTION_URL = "https://raw.githubusercontent.com/hafrey1/LunaTV-config/refs/heads/main/LunaTV-config.txt"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
NEXT_PUBLIC_SITE_NAME = "Movie"
USERNAME = "admin"
PASSWORD = "admin@123"
